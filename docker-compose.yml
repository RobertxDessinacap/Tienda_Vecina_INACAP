services:
  db:
    image: postgres:16-alpine
    container_name: inacap_postgres_db
    environment:
      POSTGRES_DB: inacap_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inacap_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inacap_backend_api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_ecommerce &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=inacap_ecommerce
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_FALLBACK_SQLITE_IF_PG_UNAVAILABLE=False
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inacap_frontend_spa
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - backend

volumes:
  pgdata:
